version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sitemapseo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sitemapseo
      POSTGRES_PASSWORD: sitemapseo_secret
      POSTGRES_DB: sitemapseo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitemapseo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sitemapseo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sitemapseo_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://sitemapseo:sitemapseo_secret@postgres:5432/sitemapseo
      SYNC_DATABASE_URL: postgresql://sitemapseo:sitemapseo_secret@postgres:5432/sitemapseo
      REDIS_URL: redis://redis:6379/0
      USE_CELERY: "true"
      SECRET_KEY: super-secret-jwt-key-change-in-production-32chars
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sitemapseo_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://sitemapseo:sitemapseo_secret@postgres:5432/sitemapseo
      SYNC_DATABASE_URL: postgresql://sitemapseo:sitemapseo_secret@postgres:5432/sitemapseo
      REDIS_URL: redis://redis:6379/0
      USE_CELERY: "true"
      SECRET_KEY: super-secret-jwt-key-change-in-production-32chars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4 -Q default,scrape,nlp

  dashboard:
    image: node:20-alpine
    container_name: sitemapseo_dashboard
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./dashboard:/app
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend

volumes:
  postgres_data:
